name: Build etaHEN 13.60 Debug Settings ELF

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build patched 13.60 ELF
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out pinned r3 source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply Debug Settings overlay and run host checks
        run: bash scripts/codex-cloud-setup.sh

      - name: Install archive and ELF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils file unzip xz-utils

      - name: Download and verify Zig 0.14.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-x86_64-linux-0.14.1.tar.xz"
          unpack_dir="$RUNNER_TEMP/zig"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz"
          echo "24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  $archive" | sha256sum --check -
          mkdir -p "$unpack_dir"
          tar -xJf "$archive" -C "$unpack_dir"
          zig_bin="$(find "$unpack_dir" -type f -name zig -print -quit)"
          test -n "$zig_bin"
          chmod +x "$zig_bin"
          echo "ZIG=$zig_bin" >> "$GITHUB_ENV"
          "$zig_bin" version

      - name: Download and verify PS5 Payload SDK v0.43
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ps5-payload-sdk-v0.43.zip"
          unpack_dir="$RUNNER_TEMP/ps5-payload-sdk-unpack"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip"
          echo "a9cc9929f21b2b2c5d5b309f3bab4997067c45281c0622cf4838b1aecba66fcb  $archive" | sha256sum --check -
          mkdir -p "$unpack_dir"
          unzip -q "$archive" -d "$unpack_dir"

          sdk_dir=""
          while IFS= read -r target_include; do
            candidate="$(dirname "$(dirname "$target_include")")"
            if [[ -f "$candidate/ldscripts/elf_x86_64.x" && -f "$candidate/target/lib/crt1.o" ]]; then
              sdk_dir="$candidate"
              break
            fi
          done < <(find "$unpack_dir" -type d -path '*/target/include' -print)

          if [[ -z "$sdk_dir" ]]; then
            echo "Could not find a PS5 SDK root with target/include, target/lib/crt1.o and ldscripts/elf_x86_64.x." >&2
            find "$unpack_dir" -maxdepth 5 -type d -print >&2
            exit 1
          fi

          echo "PS5_PAYLOAD_SDK=$sdk_dir" >> "$GITHUB_ENV"
          echo "PS5_PAYLOAD_SDK=$sdk_dir"

      - name: Fetch hash-pinned upstream payload assets
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/upstream/etaHEN/Source Code"

          curl --fail --location --retry 3 \
            "https://github.com/EchoStretch/kstuff-lite/releases/download/v1.11/kstuff.elf" \
            --output "$source_dir/bootstrapper/assets/kstuff.elf"
          curl --fail --location --retry 3 \
            "https://github.com/Pharaoh2k/ps5debug-NG/releases/download/1.3.2/ps5debug-NG_v1.3.2.elf" \
            --output "$source_dir/daemon/assets/ps5debug.elf"
          curl --fail --location --retry 3 \
            "https://github.com/EchoStretch/ps5-app-dumper/releases/download/v1.11/ps5-app-dumper.elf" \
            --output "$source_dir/daemon/assets/ps5-app-dumper.elf"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/etaHEN/etaHEN/2.5B/Source%20Code/bootstrapper/assets/fps.prx" \
            --output "$source_dir/bootstrapper/assets/fps.prx"

          credits="$RUNNER_TEMP/CREDITS.md"
          curl --fail --location --retry 3 \
            "https://github.com/GronedWaffel/etahen-11.00-13.60/releases/download/v2.5B-13.60-r3/CREDITS.md" \
            --output "$credits"
          echo "78bbfceb1be7c299aa9838a6a3839c066fb88a1d88b6a10174f943db89725e66  $credits" | sha256sum --check -

      - name: Install pinned PS5 homebrew libraries
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ps5-payload-dev-v0.40.2.tar.gz"
          extract_dir="$RUNNER_TEMP/pacbrew"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/v0.40.2/ps5-payload-dev.tar.gz"
          echo "a85f65de418a8e6a898c6c3e3c870d50fff7618a200e4dd59ea9692af6ecec4d  $archive" | sha256sum --check -
          mkdir -p "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir" opt/ps5-payload-sdk/target/user/homebrew

          sdk_homebrew="$PS5_PAYLOAD_SDK/target/user/homebrew"
          mkdir -p "$sdk_homebrew"
          cp -a "$extract_dir/opt/ps5-payload-sdk/target/user/homebrew/." "$sdk_homebrew/"
          if [[ -d "$sdk_homebrew/include" ]]; then
            echo "CPATH=$sdk_homebrew/include" >> "$GITHUB_ENV"
          fi

          source_dir="$GITHUB_WORKSPACE/upstream/etaHEN/Source Code"
          dependencies_dir="$GITHUB_WORKSPACE/upstream/etaHEN/dependencies"
          mkdir -p "$source_dir/lib" "$dependencies_dir/lib"

          copy_library() {
            library_name="$1"
            destination="$2"
            source_library="$(find "$sdk_homebrew" -type f -name "$library_name" -print -quit)"
            if [[ -z "$source_library" ]]; then
              echo "Missing $library_name in the pinned PS5 homebrew bundle." >&2
              find "$sdk_homebrew" -type f -name '*.a' -print >&2
              exit 1
            fi
            install -D "$source_library" "$destination"
            sha256sum "$destination"
          }

          for library in z curl wolfssl minizip microhttpd psl zstd; do
            copy_library "lib$library.a" "$source_dir/lib/lib$library.a"
          done
          for library in crypto ssl sqlite3; do
            copy_library "lib$library.a" "$dependencies_dir/lib/lib$library.a"
          done

      - name: Verify every pinned build input
        working-directory: upstream/etaHEN
        run: node scripts/check-build-inputs.mjs

      - name: Build patched etaHEN ELF
        working-directory: upstream/etaHEN
        run: node scripts/build-all.mjs

      - name: Inspect the built ELF
        shell: bash
        run: |
          set -euo pipefail
          elf="upstream/etaHEN/build/etaHEN-13.60-debug-settings.elf"
          test -s "$elf"
          file "$elf"
          readelf -h "$elf" | tee "$RUNNER_TEMP/elf-header.txt"
          grep -q 'Class:.*ELF64' "$RUNNER_TEMP/elf-header.txt"
          sha256sum "$elf"
          cat upstream/etaHEN/build/manifest.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: etaHEN-13.60-debug-settings
          path: |
            upstream/etaHEN/build/etaHEN-13.60-debug-settings.elf
            upstream/etaHEN/build/manifest.json
            upstream/etaHEN/BUILD-INPUTS.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish public prerelease with direct ELF download
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          elf="upstream/etaHEN/build/etaHEN-13.60-debug-settings.elf"
          manifest="upstream/etaHEN/build/manifest.json"
          input_manifest="upstream/etaHEN/BUILD-INPUTS.json"
          credits="$RUNNER_TEMP/CREDITS.md"
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          tag="v2.5B-13.60-debug-settings-$short_sha-run$GITHUB_RUN_ATTEMPT"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Unofficial etaHEN 2.5B r3 source build for PS5 firmware 13.60.

          This build includes the 13.60 Debug Settings route overlay. It was compiled and host-checked in GitHub Actions. It has not been tested on a PS5 console.

          Source and build-input details: https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA
          EOF

          gh release create "$tag" "$elf" "$manifest" "$input_manifest" "$credits" \
            --repo "$GITHUB_REPOSITORY" \
            --title "etaHEN 2.5B 13.60 Debug Settings ($short_sha)" \
            --notes-file "$notes" \
            --prerelease
