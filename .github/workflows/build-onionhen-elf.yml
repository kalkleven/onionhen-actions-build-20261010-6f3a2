name: Build OnionHEN ELF
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18-dev cmake ninja-build python3 python3-pyelftools xz-utils unzip curl file binutils librsvg2-bin
      - name: Download PS5 Payload SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ps5-sdk"
          curl -fL --retry 3 https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip -o "$RUNNER_TEMP/sdk.zip"
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$RUNNER_TEMP/ps5-sdk"
          SDK_ROOT="$(find "$RUNNER_TEMP/ps5-sdk" -maxdepth 3 -type d -name ps5-payload-sdk -print -quit)"
          test -n "$SDK_ROOT" && test -x "$SDK_ROOT/bin/prospero-cmake"
          echo "PS5_PAYLOAD_SDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=/usr/bin/llvm-config-18" >> "$GITHUB_ENV"
      - name: Install PacBrew PS5 libraries
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ps5-payload-dev.tar.gz"
          curl -fL --retry 3 https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/v0.40.2/ps5-payload-dev.tar.gz -o "$archive"
          echo "a85f65de418a8e6a898c6c3e3c870d50fff7618a200e4dd59ea9692af6ecec4d  $archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/pacbrew" "$PS5_PAYLOAD_SDK/target/user/homebrew"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pacbrew" opt/ps5-payload-sdk/target/user/homebrew
          cp -a "$RUNNER_TEMP/pacbrew/opt/ps5-payload-sdk/target/user/homebrew/." "$PS5_PAYLOAD_SDK/target/user/homebrew/"
          test -f "$PS5_PAYLOAD_SDK/target/user/homebrew/include/curl/curl.h"
          test -f "$PS5_PAYLOAD_SDK/target/user/homebrew/lib/libcurl.a"
          test -s "$PS5_PAYLOAD_SDK/target/user/homebrew/etc/ca-bundle.crt"
      - name: Apply feature patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d onionhen-eta-feature-port.patch.xz.b64 | xz -dc > "$RUNNER_TEMP/onionhen.patch"
          git apply --check "$RUNNER_TEMP/onionhen.patch"
          git apply "$RUNNER_TEMP/onionhen.patch"
      - name: Build and inspect ELF
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build.sh --release --jobs 4
          ELF=build/bin/OnionHEN.elf
          test -s "$ELF"
          file "$ELF"
          readelf -h "$ELF" | tee "$RUNNER_TEMP/elf-header.txt"
          test "$(head -c 4 "$ELF" | od -An -t x1 | tr -d ' ')" = 7f454c46
          grep -q 'Class:.*ELF64' "$RUNNER_TEMP/elf-header.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: OnionHEN-elf
          path: build/bin/OnionHEN.elf
          if-no-files-found: error
          retention-days: 1
